name: index
# Index data/ → embed → publish memory.db as a Release artifact.
# concurrency:1 serializes the writer; git commit ordering means no split-brain.
on:
  push:
    paths: ['data/**', 'tools/**']
  schedule: [{ cron: '0 4 * * *' }]
  workflow_dispatch: {}
concurrency: { group: index, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet google-genai
      - name: Build memory.db
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANAMNESIS_DATA_ROOT: ${{ github.workspace }}/data
          ANAMNESIS_OUT: ${{ github.workspace }}/memory.db
        run: python tools/index.py
      - name: Integrity floor
        run: |
          python - <<'PY'
          import sqlite3, os, json
          n = sqlite3.connect("memory.db").execute("SELECT COUNT(*) FROM chunks").fetchone()[0]
          e = sqlite3.connect("memory.db").execute("SELECT COUNT(*) FROM chunks WHERE embedding IS NOT NULL").fetchone()[0]
          size = os.path.getsize("memory.db")
          print(f"chunks={n} embedded={e} size={size}")
          assert n >= 1 and e == n and size > 20_000, "integrity floor failed"
          json.dump({"chunks": n, "embedded": e, "size_bytes": size,
                     "source_commit": os.environ.get("GITHUB_SHA","")}, open("manifest.json","w"), indent=2)
          print("INTEGRITY OK")
          PY
      - name: Publish Release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release create "build-${{ github.run_number }}" memory.db manifest.json \
            --repo "${{ github.repository }}" --latest --title "build-${{ github.run_number }}" \
            --notes "Auto-indexed memory.db from data/ (example corpus)."
