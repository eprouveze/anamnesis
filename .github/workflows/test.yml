name: test
# Unit tests + an end-to-end build/search on the mock embedding backend.
# No secrets, no network: safe on every PR, including from forks.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: pip install --quiet -r requirements.txt
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: End-to-end build and search (mock embeddings, no secrets)
        env:
          ANAMNESIS_EMBED_BACKEND: mock
          ANAMNESIS_HOME: ${{ runner.temp }}/anamnesis-home
          ANAMNESIS_DB: ${{ runner.temp }}/memory.db
          ANAMNESIS_SOURCES: ${{ github.workspace }}/anamnesis.sources.example.yaml
        run: |
          python tools/index.py sources
          python tools/index.py build
          python tools/index.py update
          python tools/index.py search "timestamps" | tee out.txt
          grep -q "datetime-utc" out.txt
